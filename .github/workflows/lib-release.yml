name: Build native libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/native -p 'test_*.py' -v

  build-windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: windows-x86_64
            python-arch: x64
            tests: "ON"
          - arch: Win32
            target: windows-x86
            python-arch: x86
            tests: "ON"
          - arch: ARM64
            target: windows-aarch64
            python-arch: x64
            tests: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Configure
        run: >-
          cmake -S . -B build -A ${{ matrix.arch }}
          -DWEBVIEW_BUILD_SHARED_LIBRARY=ON -DWEBVIEW_BUILD_STATIC_LIBRARY=OFF
          -DWEBVIEW_USE_STATIC_MSVC_RUNTIME=ON
          -DWEBVIEW_BUILD_TESTS=${{ matrix.tests }}
          -DWEBVIEW_BUILD_DOCS=OFF -DWEBVIEW_BUILD_EXAMPLES=OFF
          -DWEBVIEW_BUILD_AMALGAMATION=OFF -DWEBVIEW_ENABLE_PACKAGING=OFF
          -DWEBVIEW_ENABLE_CHECKS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Ensure WebView2 Runtime for functional tests
        if: matrix.tests == 'ON'
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client"
          )
          $installed = $keys | ForEach-Object {
            (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
          } | Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (-not $installed) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "WebView2 Runtime installation failed: $($setup.ExitCode)" }
          }
      - name: Native tests
        if: matrix.tests == 'ON'
        env:
          WEBVIEW2_USER_DATA_FOLDER: ${{ runner.temp }}\webview-tests-${{ matrix.arch }}
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Verify shared-library exports and loadability
        if: matrix.tests == 'ON'
        run: python scripts/native/package.py smoke --source build/core/Release/webview.dll
      - name: Stage verified resource
        run: >-
          python scripts/native/package.py stage --source build/core/Release/webview.dll
          --output dist --target ${{ matrix.target }} --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  build-macos:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure universal Release build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DWEBVIEW_BUILD_SHARED_LIBRARY=ON -DWEBVIEW_BUILD_STATIC_LIBRARY=OFF
          -DWEBVIEW_BUILD_TESTS=ON -DWEBVIEW_BUILD_DOCS=OFF -DWEBVIEW_BUILD_EXAMPLES=OFF
          -DWEBVIEW_BUILD_AMALGAMATION=OFF -DWEBVIEW_ENABLE_PACKAGING=OFF
          -DWEBVIEW_ENABLE_CHECKS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Native tests on the runner architecture
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Verify shared-library exports and loadability
        run: python scripts/native/package.py smoke --source build/core/libwebview.dylib
      - name: Stage both verified universal resources
        run: >-
          python scripts/native/package.py stage --source build/core/libwebview.dylib
          --output dist --target macos-universal --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-universal
          path: dist/
          if-no-files-found: error

  build-linux:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-gnu-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-gnu-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11
      - name: Configure GNU/Linux Release build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEBVIEW_WEBKITGTK_API=4.1
          -DWEBVIEW_BUILD_SHARED_LIBRARY=ON -DWEBVIEW_BUILD_STATIC_LIBRARY=OFF
          -DWEBVIEW_BUILD_TESTS=ON -DWEBVIEW_BUILD_DOCS=OFF -DWEBVIEW_BUILD_EXAMPLES=OFF
          -DWEBVIEW_BUILD_AMALGAMATION=OFF -DWEBVIEW_ENABLE_PACKAGING=OFF
          -DWEBVIEW_ENABLE_CHECKS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Native tests with a virtual display
        run: xvfb-run -a dbus-run-session -- ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Verify shared-library exports and dependencies
        run: python scripts/native/package.py smoke --source build/core/libwebview.so
      - name: Stage verified GNU resource
        run: >-
          python scripts/native/package.py stage --source build/core/libwebview.so
          --output dist --target ${{ matrix.target }} --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  collect-all:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: final-natives/
      - name: Require all seven libraries and verify architecture, commit and SHA-256
        run: python scripts/native/package.py verify --root final-natives --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: spark-webview-natives
          path: final-natives/
          if-no-files-found: error
